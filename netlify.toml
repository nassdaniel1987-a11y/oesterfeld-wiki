# `rm -f quartz.lock.json` ist hier notwendig und darf nicht entfernt werden.
# Netlify cached .quartz/plugins zwischen Builds. Liegt zusaetzlich die Lockfile
# vor, meldet `plugin install --from-config` "All configured plugins are already
# installed", ueberspringt alles - und regeneriert dabei auch .quartz/plugins/index.ts
# nicht. Der Build bricht dann mit "Could not resolve ./.quartz/plugins" ab.
#
# Die Kehrseite: Plugins kommen dadurch immer vom neuesten Stand, nicht von den
# in quartz.lock.json gepinnten Commits. Ein Pinning ueber `plugin install --clean`
# funktioniert derzeit nicht - der Befehl klont mit `--depth 1` und scheitert
# anschliessend am `git checkout <alter-commit>` (43 von 43 Plugins schlagen fehl).
# Verhalten, das sich dadurch aendert, muss deshalb ueber Plugin-Optionen in
# quartz.config.yaml abgesichert werden - siehe dort `enableCaseRedirects`.
[build]
  command = "rm -f quartz.lock.json && npx quartz plugin install --from-config && npx quartz build && node scripts/build-chat-index.mjs"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Der Chat-Index wird mit der Function ausgeliefert und von dort direkt gelesen.
# Per HTTP ginge es nicht: ein Request an die eigene Domain hat kein Auth-Cookie
# und liefe in den Passwortschutz der Edge Function.
[functions]
  included_files = ["public/static/wiki-chat-index.json"]

# Passwortschutz für das gesamte interne Wiki.
# Passwort wird über die Umgebungsvariable SITE_PASSWORD im Netlify-Dashboard gesetzt.
[[edge_functions]]
  path = "/*"
  function = "auth"
