# WICHTIG: quartz.lock.json darf hier NICHT geloescht werden.
# Ohne Lockfile zieht `plugin install` bei jedem Deploy den neuesten Stand
# aller Community-Plugins. Genau das hat den Endlos-Reload verursacht: eine
# neuere Version von `alias-redirects` legte fuer jede Seite eine Weiterleitung
# auf sich selbst an und ueberschrieb damit die echte Seite.
[build]
  command = "npx quartz plugin install --from-config && npx quartz build && node scripts/build-chat-index.mjs"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Der Chat-Index wird mit der Function ausgeliefert und von dort direkt gelesen.
# Per HTTP ginge es nicht: ein Request an die eigene Domain hat kein Auth-Cookie
# und liefe in den Passwortschutz der Edge Function.
[functions]
  included_files = ["public/static/wiki-chat-index.json"]

# Passwortschutz für das gesamte interne Wiki.
# Passwort wird über die Umgebungsvariable SITE_PASSWORD im Netlify-Dashboard gesetzt.
[[edge_functions]]
  path = "/*"
  function = "auth"
